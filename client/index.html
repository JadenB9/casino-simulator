<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A game, not a document: no pinch or double-tap zoom (touch.ts also stops Safari's pinch,
         which ignores user-scalable), and the on-screen keyboard shrinks the layout so a text
         field at the bottom stays above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0908" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Casino" />
    <meta name="description" content="Casino Simulator: walk a 3D casino and play real-odds blackjack, roulette, craps, baccarat, poker, video poker and slots with other people." />
    <title>Casino Simulator</title>
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="./icon.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles/theme.css" />
    <link rel="stylesheet" href="./src/ui/mobile.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <main id="ui"></main>
    <div id="boot" class="boot">
      <div class="boot-mark">Casino Simulator</div>
      <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
      <div class="boot-note" id="boot-note">Loading the floor</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
